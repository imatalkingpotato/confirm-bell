<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1625">
<title>컨펌벨 🔨 — 컨펌 재촉 스트레스 해소 게임</title>
<link rel="stylesheet" href="styles.css">
<script src="game.js" defer></script>
<script src="music.js" defer></script>
</head>
<body>
  <aside class="music-card" aria-label="배경 음악">
    <div class="music-heading"><span>🎶 Now Playing</span><button id="musicToggle" type="button" aria-label="배경 음악 재생">▶</button></div>
    <a href="https://www.youtube.com/watch?v=BeAE3ZRcMgs" target="_blank" rel="noopener">이 덱을 떠나주세요 1hr ver. ↗</a>
    <div id="musicStatus" role="status">음악 연결 중…</div>
    <div id="youtubePlayer" class="youtube-player"></div>
  </aside>
  <main>
    <header class="game-heading"><span class="eyebrow">THE CONFIRMATION ARCADE</span><h1>🔨 컨펌벨</h1><span class="edition">HARD HIT EDITION</span></header>
    <div class="tabs" id="tabs" aria-label="담당자 선택"></div>
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage" width="640" height="440" role="img" aria-label="뿅망치로 컨펌을 재촉하는 픽셀 사무실"></canvas>
      <canvas id="fx" width="640" height="440" aria-hidden="true"></canvas>
      <div class="stage-tag"><span class="live-dot"></span><span id="targetLabel">이슬님 · 컨펌 대기 중</span></div>
      <div class="impact-badge" id="impactBadge" aria-hidden="true">CRITICAL!</div>
    </div>
    <div class="hud">
      <div class="box">현재 콤보<strong class="num combo-num" id="combo">0</strong></div>
      <div class="box">최대 콤보<strong class="num" id="maxCombo">0</strong></div>
      <div class="box rage-box">분노 게이지<strong class="num" id="rage">0%</strong><div class="rage-track" role="progressbar" aria-label="분노 게이지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="rageMeter"><span id="rageFill"></span></div></div>
      <div class="box">타격 등급<strong class="num rank-name" id="hitRank">예의 바름</strong></div>
    </div>
    <button id="btn" type="button">🔨 컨펌 플리즈!</button>
    <div class="controls"><button id="sfxToggle" type="button" aria-pressed="true">🔊 타격음 ON</button><button id="motionToggle" type="button" aria-pressed="true">화면 흔들림 ON</button></div>
    <p class="hint">클릭 · 터치 · 스페이스바로 타격 · 숫자키 1~4로 담당자 변경<br>50콤보마다 대형 내려찍기 · 1,000 → 5,000콤보 특별 연출</p>
    <div class="boards">
      <section class="board"><h2>📊 오늘의 리더보드</h2><div class="mode" id="boardMode">개인 기록 (이 브라우저에 저장됨)</div><div id="boardToday"></div></section>
      <section class="board"><h2>🗓 이번 달 리더보드</h2><div id="boardMonth"></div><div class="yearline" id="yearLine"></div></section>
    </div>
    <div class="session-total" id="sessionTotal"></div>
  </main>
</body>
</html>
