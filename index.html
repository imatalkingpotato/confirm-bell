<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>컨펌벨 🔔 — 컨펌 재촉 스트레스 해소 게임</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Galmuri11','DungGeunMo',ui-monospace,monospace,sans-serif;
    background:#1a1625;
    color:#fff;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px; user-select:none;
    background-image:
      radial-gradient(circle at 20% 10%, #2b2340 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, #251b38 0%, transparent 50%);
  }
  @font-face { font-family:'Galmuri11'; src:url('https://cdn.jsdelivr.net/gh/quiple/galmuri@main/dist/Galmuri11.woff2') format('woff2'); }
  h1 { font-size:26px; letter-spacing:2px; margin:8px 0 2px; color:#ffd94a; text-shadow:3px 3px 0 #b3222d; }
  .sub { font-size:12px; color:#9d93b8; margin-bottom:14px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; justify-content:center; }
  .tab {
    background:#2c2440; border:2px solid #4a3f68; color:#cfc6e8;
    padding:8px 14px; font-family:inherit; font-size:14px; cursor:pointer;
    border-radius:4px; display:flex; align-items:center; gap:8px;
    transition:transform .08s;
  }
  .tab:hover { transform:translateY(-2px); }
  .tab.on { background:#e50914; border-color:#ff5a63; color:#fff; box-shadow:0 4px 0 #8c0d14; }
  .tab canvas { image-rendering:pixelated; }
  .stage-wrap { position:relative; }
  #stage {
    image-rendering:pixelated; border:3px solid #4a3f68; border-radius:6px;
    background:#000; cursor:pointer; display:block;
    max-width:100%; height:auto;
  }
  #fx {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:8;
  }
  .stage-wrap.shake { animation:shake .25s; }
  @keyframes shake {
    0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,3px)}
    40%{transform:translate(5px,-3px)} 60%{transform:translate(-4px,-2px)} 80%{transform:translate(3px,2px)}
  }
  .float-text {
    position:absolute; font-size:18px; font-weight:bold; color:#ffd94a;
    text-shadow:2px 2px 0 #000; pointer-events:none;
    animation:floatUp .8s ease-out forwards; white-space:nowrap;
  }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-46px) scale(1.4)} }
  .bubble {
    position:absolute; background:#fff; color:#222; font-size:13px;
    padding:8px 12px; border-radius:10px; pointer-events:none;
    border:2px solid #222; animation:pop .18s ease-out; white-space:nowrap; z-index:5;
  }
  .bubble:after {
    content:''; position:absolute; bottom:-8px; left:24px;
    border:6px solid transparent; border-top-color:#222;
  }
  @keyframes pop { 0%{transform:scale(.5); opacity:0} 100%{transform:scale(1); opacity:1} }
  .banner {
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    font-size:19px; color:#fff; background:rgba(229,9,20,.92);
    padding:10px 20px; border-radius:6px; pointer-events:none;
    animation:banner 1.7s ease forwards; text-align:center; z-index:6;
    border:2px solid #ffd94a; white-space:nowrap; max-width:94%;
  }
  @keyframes banner {
    0%{transform:translate(-50%,-50%) scale(.3); opacity:0}
    12%{transform:translate(-50%,-50%) scale(1.1); opacity:1}
    20%{transform:translate(-50%,-50%) scale(1)}
    80%{opacity:1} 100%{opacity:0}
  }
  .celebrate {
    position:absolute; inset:0; z-index:9; border-radius:6px;
    background:rgba(10,8,20,.74);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; animation:pop .25s ease-out; padding:20px;
  }
  .c-title { font-size:30px; color:#ffd94a; text-shadow:3px 3px 0 #b3222d; letter-spacing:2px; }
  .c-quote { font-size:20px; color:#fff; line-height:1.5; }
  .c-sub { font-size:12px; color:#cfc6e8; }
  .hud { display:flex; gap:14px; margin-top:12px; font-size:13px; flex-wrap:wrap; justify-content:center; }
  .hud .box { background:#2c2440; border:2px solid #4a3f68; padding:8px 16px; border-radius:4px; text-align:center; min-width:100px; }
  .hud .num { font-size:22px; color:#ffd94a; display:block; margin-top:2px; }
  .hud .combo-num { color:#ff5a63; }
  #btn {
    margin-top:14px; background:#e50914; border:none; color:#fff;
    font-family:inherit; font-size:18px; padding:14px 44px; border-radius:8px;
    cursor:pointer; box-shadow:0 6px 0 #8c0d14; letter-spacing:1px;
  }
  #btn:active { transform:translateY(5px); box-shadow:0 1px 0 #8c0d14; }
  .board { margin-top:18px; width:min(480px,94vw); background:#2c2440; border:2px solid #4a3f68; border-radius:6px; padding:12px 16px; }
  .board h2 { font-size:14px; color:#ffd94a; margin-bottom:2px; }
  .board .mode { font-size:10px; color:#9d93b8; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:10px; font-size:13px; padding:5px 0; }
  .row .rank { width:26px; color:#9d93b8; }
  .row .name { width:64px; }
  .row .bar-wrap { flex:1; background:#1a1625; border-radius:3px; height:12px; overflow:hidden; }
  .row .bar { height:100%; background:linear-gradient(90deg,#e50914,#ff7a45); width:0%; transition:width .3s; }
  .row .cnt { width:80px; text-align:right; color:#ffd94a; }
  .yearline { margin-top:10px; padding-top:8px; border-top:1px solid #4a3f68; font-size:11px; color:#9d93b8; text-align:center; }
  .hint { margin-top:12px; font-size:11px; color:#6f6590; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <h1>🔔 컨펌벨</h1>
  <div class="sub">뿅망치는 장난감이에요. 아프지 않아요. 마음만 전달돼요.</div>

  <div class="tabs" id="tabs"></div>

  <div class="stage-wrap" id="stageWrap">
    <canvas id="stage" width="640" height="440"></canvas>
    <canvas id="fx" width="640" height="440"></canvas>
  </div>

  <div class="hud">
    <div class="box">현재 콤보<span class="num combo-num" id="combo">0</span></div>
    <div class="box">최대 콤보<span class="num" id="maxCombo">0</span></div>
    <div class="box">내 호출<span class="num" id="total">0</span></div>
    <div class="box">오늘 호출<span class="num" id="teamToday">0</span></div>
  </div>

  <button id="btn">🔨 컨펌 플리즈!</button>

  <div class="board">
    <h2>📊 오늘의 리더보드</h2>
    <div class="mode" id="boardMode">개인 기록 (이 브라우저에 저장됨)</div>
    <div id="boardToday"></div>
  </div>

  <div class="board">
    <h2>🗓 이번 달 리더보드</h2>
    <div id="boardMonth"></div>
    <div class="yearline" id="yearLine"></div>
  </div>

  <div class="hint">스페이스바 · 클릭 · 탭 = 콩 · 숫자키 1~4 = 담당자 변경<br>콤보 1000까지 멘트가 있습니다. 그리고 아주 낮은 확률로… 좋은 일이 생깁니다.</div>

<script>
// ═══════════════════════════════════════════════════════════
//  팀 공유(누적) 리더보드 설정
//  Firebase Realtime Database URL (끝에 /confirmbell)
//  비워두면("") 개인 기록 모드(이 브라우저에만 저장)로 동작.
// ═══════════════════════════════════════════════════════════
const SHARED_DB_URL = 'https://confirm-bell-default-rtdb.firebaseio.com/confirmbell';

// ================= 담당자 데이터 =================
const PEOPLE = [
  { name:'이슬', hair:'#26180f', hairStyle:'long', top:'#7fb4d9' },
  { name:'민희', hair:'#171310', hairStyle:'wave', top:'#e8a0b4' },
  { name:'우리', hair:'#171310', hairStyle:'bob',  top:'#a4d4a0' },
  { name:'지영', hair:'#171310', hairStyle:'tied', top:'#d9c47f' },
];
const REACTIONS = ['잠시만요~','아 네네 지금 볼게요','회의 중이에요;;','5분만요!!','아직 안 봤어요…','어 방금 열었어요'];
const RARE = ['덱으로 볼게요!','앗 미팅이 많아 지금 보겠습니다','4시에 볼게요~','오늘까지 컨펌해두겠습니다','지금 바로 확인할게요!'];
const MILESTONES = {
  10:'어셋/카피/썸네일 컨펌 부탁드립니다 🙏',
  20:'컨펌 리마인드 드립니다 (벌써 2회차)',
  30:'덱에 핑 드렸습니다. 보셨죠? 보고 안 누르신 거죠?',
  50:'읽씹은 아니시죠? 아니라고 해주세요',
  70:'슬랙 1, 댓글 2, 덱 1. 지금 저만 세고 있나요?',
  100:'괜찮아요. 기다리는 게 저희 일이니까요. 아마도요.',
  150:'어셋이 오늘도 컨펌을 기다립니다. 어셋도 지쳤대요.',
  200:'혹시 미팅이 하루 24시간이세요?',
  250:'"확인해볼게요"의 "확인"은 어떤 의미셨을까요',
  300:'괜찮습니다. 어차피 오늘도 야근이었어요.',
  350:'말풍선 답장은 참 빠르시던데요. 인스타 스토리도요.',
  400:'컨펌 안 해주셔도 돼요. 대신 업로드도 없는 거예요.',
  450:'지금 보신다고요? 그 말 3시간 전에도 하셨어요.',
  500:'반환점입니다. 컨펌은 아직도 없네요.',
  600:'저희 팀 상태메시지 바꿨어요. "컨펌 대기 중"으로.',
  700:'이쯤이면 컨펌이 아니라 기적을 기다리는 중입니다.',
  800:'이 기록, 내년 위클리 첫 장에 넣겠습니다.',
  900:'괜찮아요. 울지 않아요. 프로니까요.',
  1000:'👑 천 번의 콩. 그래도 컨펌은 없었다. 👑'
};

// ================= 상태 & 저장 =================
// 수치는 일/월/연 "버킷"에 저장 → 00시·월초·연초에 자동으로 새 버킷 시작(리셋),
// 지난 버킷은 지우지 않으므로 그대로 아카이브가 된다.
const LS_KEY = 'confirmbell_v3';
const pad = n=>String(n).padStart(2,'0');
function nowKeys(){
  const d=new Date();
  const day=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  return { day, mon: day.slice(0,7), year: day.slice(0,4) };
}
let K = nowKeys();
let cur = 0;
let store = { daily:{}, monthly:{}, yearly:{}, myTotal:0, maxCombo:0 }; // 개인 기록(브라우저)
let combo = 0, maxCombo = 0, comboTimer = null;
let shared = { daily:null, monthly:null, yearly:null }; // 팀 모드 서버 값
let pending = [0,0,0,0]; // 서버 전송 대기분
let anim = { hammer:0, bonk:0, frown:0, sweat:0 };
let celebrating = false;

try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY));
  if(saved){ store = Object.assign(store, saved); maxCombo = store.maxCombo || 0; }
} catch(e){}
function save(){
  store.maxCombo = maxCombo;
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){}
}
function bucket(obj,key){ return obj[key] || (obj[key]=[0,0,0,0]); }

// 자정/월초/연초 롤오버: 날짜 키가 바뀌면 보드가 자동 전환된다
function checkRollover(){
  const k = nowKeys();
  if(k.day !== K.day){
    K = k;
    shared = { daily:null, monthly:null, yearly:null };
    if(sharedOn) poll();
    updateHud();
  }
}
setInterval(checkRollover, 20000);

// ================= 팀 공유 동기화 (Firebase RTDB REST) =================
const sharedOn = !!SHARED_DB_URL;
let poll = ()=>{};
if(sharedOn){
  document.getElementById('boardMode').textContent='팀 전체 실시간 합산 · 00시/월초 자동 리셋';
  setInterval(()=>{
    pending.forEach((n,i)=>{
      if(n>0){
        const send=n; pending[i]=0;
        [`daily/${K.day}`,`monthly/${K.mon}`,`yearly/${K.year}`].forEach((p,pi)=>{
          fetch(`${SHARED_DB_URL}/${p}/${i}.json`,{
            method:'PUT', body:JSON.stringify({'.sv':{'increment':send}})
          }).catch(()=>{ if(pi===0) pending[i]+=send; });
        });
      }
    });
  }, 2500);
  poll = ()=>{
    checkRollover();
    const get=p=>fetch(`${SHARED_DB_URL}/${p}.json`).then(r=>r.json()).catch(()=>null);
    Promise.all([get('daily/'+K.day), get('monthly/'+K.mon), get('yearly/'+K.year)]).then(([d,m,y])=>{
      const norm=v=>[0,1,2,3].map(i=>(v&&v[i])||0);
      shared = { daily:norm(d), monthly:norm(m), yearly:norm(y) };
      updateHud();
    });
  };
  poll(); setInterval(poll, 6000);
}

// ================= 캔버스 =================
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const S = 5; // 논리 해상도 128x88 (줌인)
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x*S),Math.round(y*S),Math.round(w*S),Math.round(h*S)); }
function shade(hex){
  const n=parseInt(hex.slice(1),16), r=(n>>16)*0.8|0, g=((n>>8)&255)*0.8|0, b=(n&255)*0.8|0;
  return `rgb(${r},${g},${b})`;
}

function drawScene(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const p = PEOPLE[cur];

  // ----- 배경 -----
  px(0,0,128,64,'#3d3456'); px(0,64,128,24,'#2a2340');
  // 창문 (오른쪽)
  px(98,8,26,20,'#1c1830'); px(100,10,10,7,'#8ea8d8'); px(112,10,10,7,'#a8bce0');
  px(100,19,10,7,'#7c96c8'); px(112,19,10,7,'#93aad4');
  // 벽 포스터 (왼쪽)
  px(6,8,18,24,'#b3222d'); px(9,12,12,3,'#fff'); px(9,18,12,2,'#e8b0b4'); px(9,22,9,2,'#e8b0b4');
  px(10,26,10,4,'#8c1a22');

  // ----- 담당자 (화면 중앙, 클로즈업) -----
  const hx = 56, hy = 26;
  const frown = anim.frown > 0;
  const dip = frown ? 2 : 0;   // 콩 맞으면 움찔
  // 의자 등받이
  px(hx-9, hy+9, 34, 30, '#463a63');
  px(hx-9, hy+9, 34, 2, '#584a7c');
  // 몸통 (책상까지 이어짐)
  px(hx-4, hy+17+dip, 24, 22, p.top);
  px(hx-2, hy+20+dip, 3, 14, shade(p.top));
  px(hx+15, hy+20+dip, 3, 14, shade(p.top));
  // 팔
  px(hx-6, hy+26+dip, 4, 12, p.top); px(hx+18, hy+26+dip, 4, 12, p.top);
  // 머리
  px(hx, hy+dip, 16, 16, '#f5cfa7');
  // 목
  px(hx+5, hy+16+dip, 6, 2, '#eec49a');

  // ----- 헤어 -----
  const hc = p.hair;
  if(p.hairStyle==='long'){
    px(hx-2,hy-2+dip,20,7,hc);
    px(hx-3,hy+3+dip,3,26,hc); px(hx+16,hy+3+dip,3,26,hc);
    px(hx-2,hy+24+dip,2,4,hc); px(hx+16,hy+24+dip,2,4,hc);
  }
  if(p.hairStyle==='wave'){
    px(hx-3,hy-2+dip,22,7,hc);
    for(let i=0;i<9;i++){
      const off = (i%2===0)?0:1;
      px(hx-4+off, hy+4+i*3+dip, 3, 3, hc);
      px(hx+17-off, hy+4+i*3+dip, 3, 3, hc);
    }
    px(hx-5,hy+30+dip,4,3,hc); px(hx+17,hy+30+dip,4,3,hc);
  }
  if(p.hairStyle==='bob'){
    px(hx-2,hy-2+dip,20,6,hc);
    px(hx-3,hy+2+dip,3,13,hc); px(hx+16,hy+2+dip,3,13,hc);
    px(hx-2,hy+13+dip,3,2,hc); px(hx+15,hy+13+dip,3,2,hc);
  }
  if(p.hairStyle==='tied'){
    px(hx-1,hy-2+dip,18,6,hc);
    px(hx-2,hy+2+dip,2,7,hc); px(hx+16,hy+2+dip,2,7,hc);
    px(hx+18,hy+dip,5,5,hc);
    px(hx+20,hy+5+dip,3,9,hc);
    px(hx+21,hy+14+dip,2,3,hc);
  }

  // ----- 얼굴 -----
  if(!frown){
    px(hx+3,hy+8+dip,2,2,'#222'); px(hx+11,hy+8+dip,2,2,'#222');
    px(hx+6,hy+12+dip,4,1,'#c96');
  } else {
    px(hx+2,hy+7+dip,2,1,'#222'); px(hx+4,hy+8+dip,2,1,'#222');
    px(hx+12,hy+7+dip,2,1,'#222'); px(hx+10,hy+8+dip,2,1,'#222');
    px(hx+6,hy+11+dip,4,2,'#a55'); px(hx+5,hy+12+dip,1,1,'#a55'); px(hx+10,hy+12+dip,1,1,'#a55');
    px(hx+1,hy+13+dip,2,2,'#f0a0a0'); px(hx+13,hy+13+dip,2,2,'#f0a0a0');
    px(hx+20,hy-6,1,3,'#ff5a63'); px(hx+23,hy-6,1,3,'#ff5a63');
    px(hx+19,hy-5,1,1,'#ff5a63'); px(hx+24,hy-5,1,1,'#ff5a63');
  }
  if(anim.sweat>0){ px(hx-5, hy+5+Math.floor((1-anim.sweat)*8), 2,3,'#9fd8f0'); }

  // ----- 책상 -----
  px(10,62,108,5,'#8a5a30'); px(10,61,108,1,'#a8763f');
  px(14,67,6,20,'#6e4524'); px(108,67,6,20,'#6e4524');

  // ----- 맥북 (뚜껑에 이름) -----
  px(44,60,40,2,'#e2e4ea');                  // 하판
  px(46,59,36,1,'#c9cbd2');
  px(46,44,36,16,'#c9cbd2');                 // 뚜껑
  px(46,44,36,1,'#e8eaf0'); px(46,44,1,16,'#b4b6be');
  px(81,44,1,16,'#a7a9b0'); px(46,59,36,1,'#a7a9b0');
  // 이름 (뚜껑 위, 진한 색으로)
  ctx.fillStyle='#33384a';
  ctx.font = `bold ${3.4*S}px Galmuri11, monospace`;
  ctx.textAlign='center';
  ctx.fillText(p.name+'님', 64*S, 54.5*S);

  // ----- 뿅망치: 머리 바로 위에서 수직으로 콩 -----
  const cx = hx+8;                           // 머리 중앙
  const drop = anim.hammer;                  // 1=타격, 0=대기(화면 위로 감아올림)
  const restY = 2, hitY = hy+dip-9;          // 헤드 상단 y
  const hy2 = restY + (hitY-restY)*drop;
  // 손잡이 (헤드 위로, 대기 시엔 화면 밖)
  px(cx-1.5, hy2-13, 3, 14, '#c9903a');
  px(cx-0.5, hy2-13, 1, 14, '#e0ad55');
  // 두 손
  px(cx-3, hy2-12, 6, 5, '#f5cfa7');
  px(cx-3, hy2-6, 6, 5, '#f5cfa7');
  // 헤드 (가로 원통)
  px(cx-11, hy2, 22, 9, '#ffd94a');
  px(cx-11, hy2, 4, 9, '#e50914'); px(cx+7, hy2, 4, 9, '#e50914');
  px(cx-6, hy2+1, 2, 7, '#fff');   px(cx+4, hy2+1, 2, 7, '#fff');
  px(cx-10, hy2+1, 20, 1, '#ffe98a');
  // 타격 이펙트: 스피드라인 + 별
  if(drop>0.5){
    px(cx-14, hy2-4, 1, 4, '#fff'); px(cx+13, hy2-4, 1, 4, '#fff');
    px(cx-17, hy+2, 2, 2, '#ffd94a'); px(cx+15, hy, 2, 2, '#ffd94a');
    px(cx-13, hy-5, 2, 2, '#fff8d0'); px(cx+11, hy-6, 2, 2, '#fff8d0');
  }
}

// ================= 애니메이션 루프 =================
let last=0;
function loop(t){
  const dt=(t-last)/1000; last=t;
  if(anim.hammer>0) anim.hammer=Math.max(0,anim.hammer-dt*7);
  if(anim.frown>0)  anim.frown =Math.max(0,anim.frown-dt);
  if(anim.sweat>0)  anim.sweat =Math.max(0,anim.sweat-dt*1.2);
  drawScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================= 사운드 =================
let AC;
function audio(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function bonkSound(){
  try{
    const a=audio(), t0=a.currentTime;
    const base=900*(1+Math.min(combo,40)*0.008);
    const o=a.createOscillator(), g=a.createGain();
    o.type='square'; o.frequency.setValueAtTime(base,t0);
    o.frequency.exponentialRampToValueAtTime(base*0.4, t0+0.09);
    g.gain.setValueAtTime(0.25,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.12);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+0.14);
    const o2=a.createOscillator(), g2=a.createGain();
    o2.type='sine'; o2.frequency.value=base*2.2;
    g2.gain.setValueAtTime(0.12,t0); g2.gain.exponentialRampToValueAtTime(0.001,t0+0.08);
    o2.connect(g2); g2.connect(a.destination); o2.start(t0); o2.stop(t0+0.1);
  }catch(e){}
}
function fanfare(){
  try{
    const a=audio(), t0=a.currentTime;
    const notes=[523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f,i)=>{
      const o=a.createOscillator(), g=a.createGain(), t=t0+i*0.14;
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.35);
    });
    // 마지막 화음
    notes.forEach(f=>{
      const o=a.createOscillator(), g=a.createGain(), t=t0+0.62;
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+1.15);
    });
  }catch(e){}
}

// ================= 폭죽 =================
const fxc=document.getElementById('fx'), fx=fxc.getContext('2d');
let fxParts=[], fxUntil=0, fxRunning=false, fxLastBurst=0;
function burst(){
  const x=60+Math.random()*520, y=40+Math.random()*220;
  const hue=Math.floor(Math.random()*360);
  for(let i=0;i<34;i++){
    const ang=Math.random()*Math.PI*2, sp=60+Math.random()*180;
    fxParts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:0.9+Math.random()*0.5,
      c:`hsl(${hue+Math.random()*40},95%,${55+Math.random()*25}%)`});
  }
}
let fxLastT=0;
function fxLoop(t){
  const dt=Math.min((t-fxLastT)/1000,0.05); fxLastT=t;
  fx.clearRect(0,0,640,440);
  if(performance.now()<fxUntil && performance.now()-fxLastBurst>320){ burst(); fxLastBurst=performance.now(); }
  fxParts.forEach(p=>{
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=240*dt;
    if(p.life>0){ fx.fillStyle=p.c; fx.globalAlpha=Math.min(1,p.life*2); fx.fillRect(p.x,p.y,4,4); }
  });
  fx.globalAlpha=1;
  fxParts=fxParts.filter(p=>p.life>0);
  if(fxParts.length||performance.now()<fxUntil) requestAnimationFrame(fxLoop);
  else { fxRunning=false; fx.clearRect(0,0,640,440); }
}
function startFireworks(ms){
  fxUntil=performance.now()+ms; fxLastBurst=0;
  if(!fxRunning){ fxRunning=true; fxLastT=performance.now(); requestAnimationFrame(fxLoop); }
}

// ================= 레어 이벤트: 컨펌 빵빠레 =================
function celebrate(quote){
  celebrating=true;
  clearTimeout(comboTimer);
  fanfare();
  startFireworks(4200);
  const d=document.createElement('div');
  d.className='celebrate';
  d.innerHTML=`<div class="c-title">🎊 컨펌 떴다!!! 🎊</div>
    <div class="c-quote">"${quote}"</div>
    <div class="c-sub">— ${PEOPLE[cur].name}님 · 이 순간을 캡처하세요 📸 (목격자: 나)</div>`;
  wrap.appendChild(d);
  setTimeout(()=>{
    d.remove(); celebrating=false;
    comboTimer=setTimeout(()=>{combo=0; updateHud();},1300);
  }, 4400);
}

// ================= 게임 로직 =================
const wrap=document.getElementById('stageWrap');
function hit(){
  if(celebrating) return;   // 빵빠레 감상 시간 (연타 무시)
  const p=PEOPLE[cur];
  checkRollover();
  bucket(store.daily,K.day)[cur]++;
  bucket(store.monthly,K.mon)[cur]++;
  bucket(store.yearly,K.year)[cur]++;
  store.myTotal++;
  if(sharedOn) pending[cur]++;
  combo++; maxCombo=Math.max(maxCombo,combo);
  anim.hammer=1; anim.frown=0.6;
  if(combo%7===0) anim.sweat=1;
  bonkSound(); save();
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{combo=0; updateHud();},1300);

  spawnFloat(combo%10===0?'콩——!!':'콩!', 350+Math.random()*60, 90+Math.random()*30);

  // 아주 낮은 확률(0.1%): 컨펌 빵빠레
  if(Math.random()<0.001){
    updateHud();
    celebrate(RARE[Math.floor(Math.random()*RARE.length)]);
    return;
  }
  if(combo%9===0){
    speak(REACTIONS[Math.floor(Math.random()*REACTIONS.length)]);
  } else if(combo===1||combo%5===0){
    speak(p.name+'님~!! 🙏', true);
  }

  if(MILESTONES[combo]){
    banner(MILESTONES[combo]);
    wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
  }
  updateHud();
}
function spawnFloat(txt,x,y){
  const d=document.createElement('div'); d.className='float-text'; d.textContent=txt;
  d.style.left=x+'px'; d.style.top=y+'px';
  wrap.appendChild(d); setTimeout(()=>d.remove(),850);
}
let bubbleEl=null, bubbleT=null;
function speak(txt,isMe){
  if(bubbleEl) bubbleEl.remove();
  bubbleEl=document.createElement('div');
  bubbleEl.className='bubble';
  bubbleEl.textContent=txt;
  if(isMe){ bubbleEl.style.right='30px'; bubbleEl.style.top='26px'; }
  else { bubbleEl.style.left='60px'; bubbleEl.style.top='80px'; }
  wrap.appendChild(bubbleEl);
  clearTimeout(bubbleT);
  bubbleT=setTimeout(()=>{bubbleEl&&bubbleEl.remove(); bubbleEl=null;}, 1400);
}
function banner(txt){
  const d=document.createElement('div'); d.className='banner'; d.textContent=txt;
  wrap.appendChild(d); setTimeout(()=>d.remove(),1750);
}

// ================= HUD & 리더보드 =================
const $=id=>document.getElementById(id);
function boardHtml(counts){
  const order=PEOPLE.map((p,i)=>({p,c:counts[i]})).sort((a,b)=>b.c-a.c);
  const max=Math.max(1,order[0].c);
  const medals=['🥇','🥈','🥉','4위'];
  return order.map((o,i)=>
    `<div class="row"><span class="rank">${medals[i]}</span><span class="name">${o.p.name}님</span>
     <span class="bar-wrap"><span class="bar" style="width:${o.c/max*100}%"></span></span>
     <span class="cnt">${o.c.toLocaleString()}회</span></div>`).join('');
}
function updateHud(){
  $('combo').textContent=combo;
  $('maxCombo').textContent=maxCombo;
  $('total').textContent=(store.myTotal||0).toLocaleString();
  const add=(a,b)=>a.map((v,i)=>v+b[i]);
  const cD = sharedOn ? add(shared.daily  ||[0,0,0,0], pending) : bucket(store.daily,K.day).slice();
  const cM = sharedOn ? add(shared.monthly||[0,0,0,0], pending) : bucket(store.monthly,K.mon).slice();
  const cY = sharedOn ? add(shared.yearly ||[0,0,0,0], pending) : bucket(store.yearly,K.year).slice();
  $('teamToday').textContent=cD.reduce((a,b)=>a+b,0).toLocaleString();
  $('boardToday').innerHTML=boardHtml(cD);
  $('boardMonth').innerHTML=boardHtml(cM);
  $('yearLine').textContent=`🗄 ${K.year}년 팀 누적 ${cY.reduce((a,b)=>a+b,0).toLocaleString()}회 · 해가 바뀌면 이전 기록은 자동 보관됩니다`;
}

// ================= 캐릭터 탭 =================
function avatarCanvas(p){
  const c=document.createElement('canvas'); c.width=20; c.height=20;
  c.style.width='20px'; c.style.height='20px';
  const x=c.getContext('2d');
  x.fillStyle='#f5cfa7'; x.fillRect(4,6,12,12);
  x.fillStyle=p.hair; x.fillRect(3,4,14,5);
  if(p.hairStyle==='long'||p.hairStyle==='wave'){ x.fillRect(2,8,3,12); x.fillRect(15,8,3,12); }
  if(p.hairStyle==='bob'){ x.fillRect(2,8,3,8); x.fillRect(15,8,3,8); }
  if(p.hairStyle==='tied'){ x.fillRect(16,3,4,5); }
  x.fillStyle='#222'; x.fillRect(7,12,2,2); x.fillRect(12,12,2,2);
  return c;
}
const tabs=$('tabs');
PEOPLE.forEach((p,i)=>{
  const b=document.createElement('button'); b.className='tab'+(i===0?' on':'');
  b.appendChild(avatarCanvas(p));
  b.appendChild(document.createTextNode(p.name+'님'));
  b.onclick=()=>{ cur=i; combo=0; document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i)); updateHud(); speak('…네? 저요?'); };
  tabs.appendChild(b);
});

cv.addEventListener('pointerdown',e=>{e.preventDefault(); hit();});
$('btn').addEventListener('pointerdown',e=>{e.preventDefault(); hit();});
updateHud();
